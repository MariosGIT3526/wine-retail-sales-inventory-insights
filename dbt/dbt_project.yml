name: abs_wine
version: "1.0.0"
config-version: 2
profile: abs_wine

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

vars:
  # Item types that are real products (DUNNAGE = pallets/packing, REF = refunds, STR_SUPPLIES = store supplies)
  product_item_types: ["WINE", "LIQUOR", "BEER", "KEGS", "NON-ALCOHOL"]

models:
  abs_wine:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  abs_wine:
    +schema: seeds
